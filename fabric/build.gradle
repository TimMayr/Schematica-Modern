plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

    // LunatriusCore
    modImplementation files("../libs/lunatriuscore-fabric-${project.minecraft_version}-${project.lunatriuscore_version}.jar")

    // NeoForge Config API Port
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"

    // Common Networking
    modImplementation "mysticdrew:common-networking-fabric:${project.common_networking_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    var replaceProperties = [version                 : project.version,
                             mod_id                  : mod_id,
                             mod_name                : mod_name,
                             fabric_version          : fabric_loader_version,
                             fabric_api_version      : fabric_api_version,
                             minecraft_version       : minecraft_version,
                             architectury_api_version: architectury_api_version]

    inputs.properties replaceProperties

    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}

sourceSets {
    api {
        java {
            srcDirs = ['src/main/java/com/github/lunatrius/schematica/api/api']
        }
    }
}

tasks.register('apiJar', Jar) {
    dependsOn 'classes'
    from sourceSets.api.output
    archiveClassifier = 'api'
}