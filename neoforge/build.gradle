plugins {
	id 'com.github.johnrengelman.shadow'
}

architectury {
	platformSetupLoomIde()
	neoForge()
}

version = "${project.minecraft_version}-${project.mod_version}-NeoForge"

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentNeoForge.extendsFrom common

	// Files in this configuration will be bundled into your mod using the Shadow plugin.
	// Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases'
	}
}

dependencies {
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"

	// LunatriusCore
	modImplementation files("../libs/lunatriuscore-neoforge-${project.minecraft_version}-${project.lunatriuscore_version}.jar")

	// Common Networking
	modImplementation "mysticdrew:common-networking-neoforge:${project.common_networking_version}"

	// Architectury API. This is optional, and you can comment it out if you don't need it.
	modImplementation "dev.architectury:architectury-neoforge:${project.architectury_api_version}"

	common(project(path: ':common', configuration: 'namedElements')) { transitive false }
	shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
	var replaceProperties = [version                 : project.version,
	                         mod_id                  : mod_id,
	                         mod_name                : mod_name,
	                         neoforge_version        : neoforge_version,
	                         minecraft_version       : minecraft_version,
	                         architectury_api_version: architectury_api_version]

	inputs.properties replaceProperties

	// Apply substitution to the specific file
	filesMatching('META-INF/neoforge.mods.toml') {
		expand(replaceProperties)  // Apply property replacement here
	}
}

shadowJar {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}

remapJar {
	inputFile.set shadowJar.archiveFile
}

sourceSets {
	api {
		java {
			srcDirs = ['src/main/java/com/github/lunatrius/schematica/api/api']
		}
	}
}

tasks.register('apiJar', Jar) {
	dependsOn 'classes'
	from sourceSets.api.output
	archiveClassifier = 'api'
}